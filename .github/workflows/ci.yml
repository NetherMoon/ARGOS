name: Pretest correctness
on: [push, pull_request]
jobs:
  portable:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: argos --help
  paper-cpu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
          cache: pip
          cache-dependency-path: constraints-paper-cpu.txt
      - run: python -m pip install -c constraints-paper-cpu.txt setuptools wheel
      - run: python -m pip install --no-build-isolation -c constraints-paper-cpu.txt --extra-index-url https://download.pytorch.org/whl/cpu -e '.[dev]'
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: argos --help
