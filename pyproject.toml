[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argos-flexdc"
dynamic = ["version"]
description = "Adaptive Region-Guided Optimization Search for frozen CONDOR and FlexDC"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy", "pandas", "scipy", "torch", "PyYAML", "scikit-learn", "matplotlib", "psutil", "tqdm"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
argos = "argos.cli:main"

[tool.setuptools.dynamic]
version = {attr = "argos.versions.SOFTWARE_VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".deps", "runs", "condor_set_transformer_sweep_v3_behavior_v3_best_feasibility_artifacts"]
